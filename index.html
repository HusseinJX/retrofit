<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROFIT — Industrial IoT Network</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #040c18; }
body { font-family: 'Courier New', monospace; }
#wrap { position: fixed; left: 480px; right: 0; top: 0; bottom: 0; z-index: 1; }

#scanline {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);
}
.corner { position: fixed; width: 26px; height: 26px; z-index: 10; pointer-events: none; border-color: #00b4ff33; border-style: solid; }
#c-tl { top:18px; left:18px; border-width:1px 0 0 1px; }
#c-tr { top:18px; right:18px; border-width:1px 1px 0 0; }
#c-bl { bottom:72px; left:18px; border-width:0 0 1px 1px; }
#c-br { bottom:72px; right:18px; border-width:0 1px 1px 0; }

/* full-height left edge bg so brand + metrics share the dark strip */
#left-bg {
  position:fixed; left:0; top:0; bottom:0; width:480px; z-index:9; pointer-events:none;
  background:linear-gradient(90deg,rgba(4,10,22,0.97) 78%,rgba(4,10,22,0) 100%);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#brand { position: fixed; top:26px; left:34px; z-index:10; pointer-events:none; }
#brand h1 { font-size:36px; font-weight:900; letter-spacing:10px; color:#00b4ff; text-transform:uppercase; text-shadow:0 0 32px #00b4ff66; }
#brand .sub { font-size:13px; letter-spacing:3px; color:#00b4ff44; margin-top:7px; text-transform:uppercase; }

#ldisp { position:fixed; top:26px; right:34px; z-index:10; pointer-events:none; text-align:right; }
#lname { font-size:20px; letter-spacing:5px; font-weight:bold; color:#00ffcc; text-transform:uppercase; text-shadow:0 0 20px #00ffcc66; }
#ldesc { font-size:13px; letter-spacing:2px; color:#00ffcc55; margin-top:7px; text-transform:uppercase; }
#lnum  { font-size:12px; letter-spacing:3px; color:#00b4ff44; margin-top:5px; }

#metrics { position:fixed; bottom:100px; left:34px; z-index:11; pointer-events:none; }
.metric { display:flex; gap:12px; align-items:center; font-size:13px; letter-spacing:2px; color:#00b4ff55; margin:7px 0; text-transform:uppercase; }
.dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.db  { background:#00b4ff; box-shadow:0 0 8px #00b4ff; animation:blink 2s ease infinite; }
.dc  { background:#00ffcc; box-shadow:0 0 8px #00ffcc; animation:blink 2.4s ease infinite; }
.do  { background:#ff6b35; box-shadow:0 0 8px #ff6b35; animation:blink 1.6s ease infinite; }
.dg  { background:#39ff14; box-shadow:0 0 8px #39ff14; animation:blink 1.9s ease infinite; }
.val { color:#00ffcc; font-weight:bold; min-width:120px; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.25} }

#rpanel { position:fixed; right:34px; bottom:100px; z-index:10; pointer-events:none; text-align:right; }
.rs { font-size:13px; letter-spacing:2px; color:#00b4ff44; margin:7px 0; text-transform:uppercase; }
.rv { color:#00b4ff88; }

#story {
  position:fixed; left:0; top:92px; bottom:185px; z-index:10; pointer-events:none;
  width:460px; opacity:0; transition:opacity 0.7s ease;
  display:flex; flex-direction:column; justify-content:center;
  padding:0 48px 0 34px;
  overflow:hidden;
}
#story.vis { opacity:1; }
#story-label {
  font-size:11px; letter-spacing:3px; color:#00b4ff44; text-transform:uppercase;
  padding-bottom:10px; border-bottom:1px solid #00b4ff18; margin-bottom:18px;
}
#story-title {
  font-size:22px; letter-spacing:3px; color:#00b4ffee; text-transform:uppercase;
  font-weight:bold; margin-bottom:18px; text-shadow:0 0 24px #00b4ff55; line-height:1.3;
}
#story-body {
  font-size:13px; line-height:1.9; letter-spacing:0.3px; color:#00b4ffaa;
  overflow:hidden;
}

#progress { position:fixed; top:0; left:0; height:2px; z-index:20; background:linear-gradient(90deg,transparent,#00b4ff,#00ffcc,transparent); width:20%; box-shadow:0 0 10px #00b4ff; transition:width 0.5s ease; }
#overlay  { position:fixed; inset:0; z-index:30; pointer-events:none; opacity:0; background:radial-gradient(circle,#00b4ff08 0%,transparent 70%); transition:opacity 0.3s; }
#overlay.flash { opacity:1; }

#nav { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:10; }
.nbtn {
  padding:11px 22px; background:rgba(4,12,24,0.9); border:1px solid #00b4ff20;
  color:#00b4ff55; cursor:pointer; font-family:'Courier New',monospace;
  font-size:12px; letter-spacing:2px; text-transform:uppercase;
  transition:all 0.2s; backdrop-filter:blur(12px); outline:none; user-select:none; white-space:nowrap;
}
.nbtn:hover { background:rgba(0,180,255,0.08); border-color:#00b4ff55; color:#00b4ffaa; }
.nbtn.active { background:rgba(0,180,255,0.14); border-color:#00b4ffcc; color:#00b4ff; box-shadow:0 0 18px #00b4ff22; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="scanline"></div>
<div id="left-bg"></div>
<div id="progress"></div>
<div id="overlay"></div>
<div class="corner" id="c-tl"></div><div class="corner" id="c-tr"></div>
<div class="corner" id="c-bl"></div><div class="corner" id="c-br"></div>

<div id="brand"><h1>RETROFIT</h1><div class="sub">Industrial IoT · Edge-to-Network Intelligence Platform</div></div>

<div id="story">
  <div id="story-label">◈ NODE INTELLIGENCE</div>
  <div id="story-title"></div>
  <div id="story-body"></div>
</div>

<div id="ldisp">
  <div id="lname">Retrofit Device</div>
  <div id="ldesc">Edge sensor · Real-time data capture</div>
  <div id="lnum">LEVEL 01 / 05</div>
</div>

<div id="metrics">
  <div class="metric"><div class="dot db"></div>SENSORS &nbsp;<span class="val" id="ms">1</span></div>
  <div class="metric"><div class="dot dc"></div>DATA STREAMS &nbsp;<span class="val" id="md">4 / s</span></div>
  <div class="metric"><div class="dot do"></div>NETWORK NODES &nbsp;<span class="val" id="mn">1</span></div>
  <div class="metric"><div class="dot dg"></div>EFFICIENCY &nbsp;<span class="val" id="me">—</span></div>
</div>
<div id="rpanel">
  <div class="rs">UPTIME &nbsp;<span class="rv" id="ru">99.9%</span></div>
  <div class="rs">LATENCY &nbsp;<span class="rv" id="rl">2 ms</span></div>
  <div class="rs">THROUGHPUT &nbsp;<span class="rv" id="rt">840 KB/s</span></div>
  <div class="rs">PROTOCOL &nbsp;<span class="rv">MQTT · OPC-UA</span></div>
</div>

<div id="nav">
  <button class="nbtn active" onclick="goTo(0)">◉ DEVICE</button>
  <button class="nbtn" onclick="goTo(1)">◈ MACHINE</button>
  <button class="nbtn" onclick="goTo(2)">▦ SHOP FLOOR</button>
  <button class="nbtn" onclick="goTo(3)">⬡ FACILITY</button>
  <button class="nbtn" onclick="goTo(4)">◎ NETWORK</button>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script>
// ── RENDERER ──────────────────────────────────
const SIDEBAR=480, W=window.innerWidth-SIDEBAR, H=window.innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping; renderer.toneMappingExposure=1.0;
document.getElementById('wrap').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040c18);
scene.fog=new THREE.FogExp2(0x040c18, 0.004);

const camera=new THREE.PerspectiveCamera(52,W/H,0.01,20000);

// ── GLOBAL LIGHTS (shared across all levels) ──
// Strong white ambient — Lambert materials show full color on all faces
scene.add(new THREE.AmbientLight(0xffffff, 2.2));
// Multi-angle directionals so no face is ever in full darkness
function dlight(col,intensity,x,y,z){const l=new THREE.DirectionalLight(col,intensity);l.position.set(x,y,z);scene.add(l);}
dlight(0xaaccff,1.6, 20, 40, 20);   // key — top front right
dlight(0x88aacc,1.2,-20, 30, 10);   // fill — top left
dlight(0x6688bb,0.9,  0,-20, 10);   // under — bottom fill
dlight(0x8899bb,0.8,  0, 10,-20);   // back
dlight(0x7799bb,0.7, 20, 10,-10);   // side

// ── MATERIALS ────────────────────────────────
// MeshLambertMaterial: responds to ambient fully — no specular darkening, all faces lit
const L=(col)=>new THREE.MeshLambertMaterial({color:col});
const E=(col,em,ei)=>new THREE.MeshStandardMaterial({color:col,emissive:new THREE.Color(em),emissiveIntensity:ei,roughness:0.85,metalness:0});
const M={
  chassis: L(0x3d5e7a),
  panel:   L(0x2e4d6a),
  steel:   L(0x5e82a0),
  floor:   L(0x08101e),
  concrete:L(0x253d54),
  blue:    E(0x003366,0x00b4ff,3.0),
  cyan:    E(0x003333,0x00ffcc,2.8),
  orange:  E(0x3a1200,0xff6b35,3.0),
  green:   E(0x003300,0x39ff14,2.6),
  yellow:  E(0x332800,0xffcc00,3.0),
};
// cm: clone + override — works for both Lambert and Standard
function cm(base,ov={}){
  const m=base.clone();
  if(ov.color!==undefined) m.color.set(ov.color);
  if(ov.emissiveIntensity!==undefined&&m.emissiveIntensity!==undefined) m.emissiveIntensity=ov.emissiveIntensity;
  if(ov.emissive!==undefined&&m.emissive!==undefined) m.emissive.set(ov.emissive);
  if(ov.transparent!==undefined){m.transparent=ov.transparent;}
  if(ov.opacity!==undefined){m.opacity=ov.opacity;}
  if(ov.metalness!==undefined&&m.metalness!==undefined) m.metalness=ov.metalness;
  return m;
}

// ── GEOMETRY HELPERS ─────────────────────────
function box(w,h,d,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,seg,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; return m;
}
function sph(r,seg,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat);
  m.position.set(x,y,z); return m;
}
function tor(r,tube,seg,rseg,mat){return new THREE.Mesh(new THREE.TorusGeometry(r,tube,seg,rseg),mat);}
function mkGrid(size,divs,col,op=0.35){
  const g=new THREE.GridHelper(size,divs,new THREE.Color(col),new THREE.Color(col));
  g.material.opacity=op; g.material.transparent=true; return g;
}
function gline(pts,col,op=0.7){
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});
  return new THREE.Line(g,m);
}
function arc(p0,p1,col,op=0.5){
  const d=p0.distanceTo(p1);
  const mid=new THREE.Vector3((p0.x+p1.x)/2,Math.max(p0.y,p1.y)+d*0.38,(p0.z+p1.z)/2);
  return gline(new THREE.QuadraticBezierCurve3(p0,mid,p1).getPoints(50),col,op);
}
function wireBox(w,h,d,col,op=0.4){
  const geo=new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d));
  const mat=new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:op,blending:THREE.AdditiveBlending});
  return new THREE.LineSegments(geo,mat);
}
function mkFlow(n,col,spread,yMin,yMax){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3), spd=new Float32Array(n);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()-.5)*spread; pos[i*3+1]=yMin+Math.random()*(yMax-yMin); pos[i*3+2]=(Math.random()-.5)*spread;
    spd[i]=0.15+Math.random()*0.3;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({
    color:new THREE.Color(col),size:0.12,transparent:true,opacity:0.8,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
  }));
  return {pts,spd,geo,yMin,yMax,spread};
}

// ── ANIMATED REFS ────────────────────────────
const flows=[], wRings=[], facilNodes=[];
let ledRingRef, devLightRef, hubLightRef, t=0;

// ── STARFIELD ────────────────────────────────
{
  const sp=new Float32Array(3000*3);
  for(let i=0;i<3000;i++){sp[i*3]=(Math.random()-.5)*12000;sp[i*3+1]=(Math.random()-.5)*6000;sp[i*3+2]=(Math.random()-.5)*12000;}
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x2255aa,size:2.5,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false})));
}

// ════════════════════════════════════════════
//  LEVEL 0 — RETROFIT DEVICE
// ════════════════════════════════════════════
const G0=new THREE.Group(); scene.add(G0);

// Horizontal pipe
const pipeMat=cm(M.steel,{color:0x5a7e9a});
const pipe=cyl(0.55,0.55,6,28,pipeMat,0,0.45);
pipe.rotation.z=Math.PI/2; G0.add(pipe);
for(const px of[-2.2,2.2]){const f=cyl(0.68,0.68,0.18,24,cm(M.steel,{color:0x4a6880}),px,0.45);f.rotation.z=Math.PI/2;G0.add(f);}

// Sensor body sitting on pipe
const sG=new THREE.Group(); sG.position.set(0,1.5,0); G0.add(sG);
sG.add(cyl(0.65,0.7,1.7,32,M.chassis,0,0.35));
sG.add(cyl(0.68,0.65,0.1,32,M.steel,0,1.2));
sG.add(cyl(0.7,0.67,0.12,32,M.panel,0,-0.49));
for(let i=0;i<5;i++){const r=tor(0.66,0.022,8,32,M.steel);r.rotation.x=Math.PI/2;r.position.y=-0.28+i*0.32;sG.add(r);}

// Glowing LED ring
const lrMat=cm(M.blue,{emissiveIntensity:3.0});
const lRing=tor(0.6,0.048,16,64,lrMat); lRing.rotation.x=Math.PI/2; lRing.position.y=0.92; sG.add(lRing); ledRingRef=lRing;
for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2;sG.add(sph(0.05,8,[M.cyan,M.blue,M.green,M.blue][i%4],Math.cos(a)*0.6,0.92,Math.sin(a)*0.6));}

// Display panel
const dg=new THREE.Group(); dg.position.set(0.66,0.28,0); dg.rotation.y=Math.PI/2; sG.add(dg);
dg.add(box(0.55,0.35,0.02,cm(M.chassis,{color:0x081828})));
dg.add(box(0.44,0.25,0.01,cm(M.blue,{emissiveIntensity:2})));
for(let i=0;i<4;i++) dg.add(box(0.35,0.018,0.005,cm(M.cyan,{emissiveIntensity:1.5}),0,-0.08+i*0.055,0.006));

// Antenna
const ant=cyl(0.018,0.026,0.9,8,M.steel,0.38,1.55); ant.rotation.z=0.22; sG.add(ant);
sG.add(sph(0.048,8,M.cyan,0.38+Math.sin(0.22)*0.45,1.55+Math.cos(0.22)*0.45,0));

// Clamp arms
for(const s of[-1,1]){
  sG.add(box(0.28,0.28,0.6,M.steel,s*0.72,-0.38,0));
  const b=cyl(0.042,0.042,0.18,8,M.steel,s*0.88,-0.38); b.rotation.z=Math.PI/2; sG.add(b);
  sG.add(sph(0.06,8,M.steel,s*0.97,-0.38,0));
}
sG.add(box(1.45,0.1,0.65,M.panel,0,-0.55,0));
sG.add(cyl(0.1,0.12,0.2,12,M.panel,-0.3,-0.62,0.28));
sG.add(cyl(0.07,0.07,0.12,8,cm(M.blue,{emissiveIntensity:2},-0.3,-0.62,0.32)));

// Wireless rings
for(let i=0;i<5;i++){
  const rm=tor(1,0.022,8,64,new THREE.MeshBasicMaterial({color:0x00b4ff,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  rm.rotation.x=Math.PI/2; rm.position.y=2.4; G0.add(rm); wRings.push({mesh:rm,phase:i/5});
}

// Particles + lights
const df=mkFlow(80,0x00b4ff,0.5,2.5,7); G0.add(df.pts); flows.push(df);
devLightRef=new THREE.PointLight(0x00b4ff,8,15); devLightRef.position.set(0,2.2,0); G0.add(devLightRef);
G0.add(new THREE.PointLight(0x00ffcc,4,10,new THREE.Vector3(0,1.5,0)));
G0.add(new THREE.PointLight(0xffffff,5,18,new THREE.Vector3(4,5,4)));
G0.add(new THREE.PointLight(0xffffff,5,18,new THREE.Vector3(-4,4,-4)));

// Floor
const g0=mkGrid(22,22,0x0055cc,0.55); g0.position.y=-0.79; G0.add(g0);

// ── SENSOR TEMPLATE ─────────────────────────
function mkSensor(scale=1,col=0x00b4ff){
  const g=new THREE.Group();
  const eM=cm(M.blue,{emissive:new THREE.Color(col),emissiveIntensity:2.8});
  g.add(cyl(0.42*scale,0.46*scale,1.1*scale,24,M.chassis,0,0.25*scale));
  g.add(cyl(0.46*scale,0.42*scale,0.1*scale,24,M.steel,0,0.82*scale));
  g.add(cyl(0.46*scale,0.43*scale,0.1*scale,24,M.panel,0,-0.3*scale));
  const lr2=tor(0.38*scale,0.03*scale,12,48,eM); lr2.rotation.x=Math.PI/2; lr2.position.y=0.55*scale; g.add(lr2);
  for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2; g.add(sph(0.04*scale,8,eM,Math.cos(a)*0.38*scale,0.55*scale,Math.sin(a)*0.38*scale));}
  g.add(cyl(0.016*scale,0.022*scale,0.6*scale,8,M.steel,0.28*scale,0.88*scale));
  g.add(sph(0.038*scale,8,eM,0.28*scale,0.88*scale+0.32*scale));
  return g;
}

// ════════════════════════════════════════════
//  LEVEL 1 — MACHINE
// ════════════════════════════════════════════
const G1=new THREE.Group(); scene.add(G1); G1.visible=false;

function mkMachine(colA=0x00b4ff,colB=0x00ffcc,colC=0xff6b35){
  const g=new THREE.Group();
  g.add(box(8,0.6,6,cm(M.steel,{color:0x2a4060}),0,0.3));
  g.add(box(6.5,10,5,M.chassis,0,5.3));
  g.add(box(6.52,8,0.18,M.panel,0,4.8,2.59));
  // Display
  g.add(box(3.2,2.0,0.07,cm(M.blue,{emissive:new THREE.Color(colA),emissiveIntensity:2.2}),0,7.3,2.67));
  for(let i=0;i<5;i++) g.add(box(2.5,0.07,0.04,cm(M.cyan,{emissive:new THREE.Color(colA),emissiveIntensity:1.5}),0,6.4+i*0.22,2.7));
  // Status LEDs
  [[colA],[colB],[colC],[0x39ff14]].forEach(([c],i)=>{
    const lm=cm(M.blue,{emissive:new THREE.Color(c),emissiveIntensity:3});
    g.add(sph(0.13,8,lm,-1.8+i*0.45,5.8,2.69));
    const pl=new THREE.PointLight(new THREE.Color(c),1.5,3); pl.position.set(-1.8+i*0.45,5.8,2.7); g.add(pl);
  });
  for(let i=0;i<6;i++) g.add(box(4.8,0.06,0.04,cm(M.steel,{color:0x2a4a60}),0,3.0+i*0.28,2.66));
  g.add(box(5.2,0.12,0.04,cm(M.blue,{emissive:new THREE.Color(colA),emissiveIntensity:1.2}),0,8.8,2.66));
  // Top head
  g.add(box(4,2.5,3,cm(M.chassis,{color:0x1a2e44}),0,11.2));
  g.add(cyl(0.6,0.6,3.8,20,M.steel,0,11.5));
  g.add(cyl(0.4,0.4,1.5,16,cm(M.blue,{emissive:new THREE.Color(colA),emissiveIntensity:2.5}),0,13.5));
  g.add(sph(0.3,16,cm(M.cyan,{emissive:new THREE.Color(colA),emissiveIntensity:3.5}),0,14.5));
  const spl=new THREE.PointLight(new THREE.Color(colA),4,10); spl.position.set(0,14.5,0); g.add(spl);
  for(const sx of[-3.5,3.5]) for(const sz of[-2.2,2.2]) g.add(box(0.28,10.5,0.28,M.steel,sx,5.2,sz));
  // Side accents
  g.add(box(0.2,10,0.55,cm(M.steel,{color:0x3a5878}),-3.9,5.2,0));
  g.add(box(2.2,1.5,0.9,cm(M.chassis,{color:0x1a2e44}),2.6,1.5,2.2));

  // Retrofit sensors — 3 positions
  const sPos=[
    {x:3.55,y:4,z:0,ry:-Math.PI/2,col:colA},

let cur=0, camTP=LEVELS[0].camPos.clone(), camTL=LEVELS[0].camLook.clone(), camCL=LEVELS[0].camLook.clone();
let lerpSpeed=0.04, lerpDecay=false;
camera.position.copy(LEVELS[0].camPos); scene.fog.density=LEVELS[0].fog;

function setStory(lv){
  const el=document.getElementById('story');
  el.classList.remove('vis');
  setTimeout(()=>{
    document.getElementById('story-title').textContent=lv.storyTitle;
    document.getElementById('story-body').textContent=lv.storyBody;
    el.classList.add('vis');
  },200);
}

function goTo(i){
  if(i===cur)return;
  const prev=cur;
  LEVELS[prev].group.visible=false; cur=i; LEVELS[i].group.visible=true;

  // Camera blast: overshoot then settle for snappy 3D feel
  const fromPos=camera.position.clone();
  const toPos=LEVELS[i].camPos.clone();
  const dir=toPos.clone().sub(fromPos).normalize();
  const dist=fromPos.distanceTo(toPos);
  camTP=toPos.clone().add(dir.multiplyScalar(dist*0.08)); // gentle 8% overshoot
  setTimeout(()=>{ camTP=toPos.clone(); },400);

  camTL=LEVELS[i].camLook.clone();
  scene.fog.density=LEVELS[i].fog;
  lerpSpeed=0.055; lerpDecay=true;
  setTimeout(()=>{ lerpSpeed=0.04; lerpDecay=false; },2200);

  const lv=LEVELS[i];
  document.getElementById('lname').textContent=lv.name;
  document.getElementById('ldesc').textContent=lv.desc;
  document.getElementById('lnum').textContent=lv.num;
  ['ms','md','mn','me','ru','rl','rt'].forEach(k=>document.getElementById(k).textContent=lv[k]);
  document.querySelectorAll('.nbtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.getElementById('progress').style.width=(20+i*20)+'%';
  const ov=document.getElementById('overlay'); ov.classList.add('flash'); setTimeout(()=>ov.classList.remove('flash'),350);
  setStory(lv);
}

// Init story for level 0
setTimeout(()=>setStory(LEVELS[0]),600);

// ── SCROLL ───────────────────────────────────
let scrollLocked=false;
window.addEventListener('wheel',(e)=>{
  if(scrollLocked)return;
  const dir=e.deltaY>0?1:-1;
  const next=Math.max(0,Math.min(LEVELS.length-1,cur+dir));
  if(next===cur)return;
  scrollLocked=true;
  goTo(next);
  setTimeout(()=>scrollLocked=false,2000);
},{passive:true});

// Touch swipe
let touchY0=0;
window.addEventListener('touchstart',e=>{touchY0=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  if(scrollLocked)return;
  const dy=touchY0-e.changedTouches[0].clientY;
  if(Math.abs(dy)<40)return;
  const next=Math.max(0,Math.min(LEVELS.length-1,cur+(dy>0?1:-1)));
  if(next===cur)return;
  scrollLocked=true; goTo(next); setTimeout(()=>scrollLocked=false,2000);
},{passive:true});

// ── ANIMATE ──────────────────────────────────
function animate(){
  requestAnimationFrame(animate); t+=0.016;
  // Smooth camera with variable speed
  if(lerpDecay) lerpSpeed=Math.max(0.04,lerpSpeed*0.97);
  camera.position.lerp(camTP,lerpSpeed); camCL.lerp(camTL,lerpSpeed*0.8); camera.lookAt(camCL);
  // Gentle orbit
  const bp=LEVELS[cur].camPos;
  camTP.lerp(new THREE.Vector3(bp.x+Math.sin(t*0.06)*bp.z*0.05,bp.y+Math.sin(t*0.04)*bp.y*0.02,bp.z+Math.cos(t*0.07)*bp.z*0.04),0.005);

  // Wireless rings (L0)
  if(G0.visible){
    wRings.forEach(w=>{const p=(t*0.4+w.phase)%1;w.mesh.scale.setScalar(1+p*3);w.mesh.material.opacity=(1-p)*0.45;});
    if(ledRingRef) ledRingRef.material.emissiveIntensity=2.5+Math.sin(t*2.8)*1.0;
    if(devLightRef) devLightRef.intensity=7+Math.sin(t*1.8)*2.5;
  }
  // Hub pulse (L2)
  if(G2.visible&&hubLightRef) hubLightRef.intensity=10+Math.sin(t*1.4)*4;
  // Network beacons (L4)
  if(G4.visible) facilNodes.forEach((fn,i)=>{
    const p=(t*0.32+i*0.12)%1; fn.bpr.scale.setScalar(1+p*2.8); fn.bpr.material.opacity=(1-p)*0.42;
    fn.bL.intensity=9+Math.sin(t*1.0+i*0.9)*3;
  });

  // Flow particles
  flows.forEach(fs=>{
    const pa=fs.geo.attributes.position.array,cnt=pa.length/3;
    for(let i=0;i<cnt;i++){
      pa[i*3+1]+=fs.spd[i]*0.18;
      if(pa[i*3+1]>fs.yMax){pa[i*3+1]=fs.yMin;pa[i*3]=(Math.random()-.5)*fs.spread;pa[i*3+2]=(Math.random()-.5)*fs.spread;}
    }
    fs.geo.attributes.position.needsUpdate=true;
  });
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{const w=window.innerWidth-SIDEBAR,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);});
window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='5')goTo(+e.key-1);if(e.key==='ArrowRight'||e.key===']')goTo(Math.min(4,cur+1));if(e.key==='ArrowLeft'||e.key==='[')goTo(Math.max(0,cur-1));});
</script>
</body>
